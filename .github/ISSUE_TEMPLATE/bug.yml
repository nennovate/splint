name: Bug
description: Something in Splint doesn't work as its docs say.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        A vulnerability goes to [private reporting](https://github.com/nennovate/splint/security/advisories/new), never here. Remove keys, tokens, recovery codes and anyone's messages from what you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands or actions that show it, from a clean start if you can.
      placeholder: |
        1. splint start
        2. ...
    validations:
      required: true
  - type: dropdown
    id: piece
    attributes:
      label: Which piece
      options:
        - splint (the command)
        - Signet
        - Host
        - owner-key
        - The owner's page
        - MCP adapter
        - HTTP adapter
        - Docs
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `splint --version`, or a commit.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26.1, Ubuntu 24.04, Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      render: shell
  - type: textarea
    id: cause
    attributes:
      label: Likely cause
      description: Optional. Your analysis of why it happens, if you looked.
