name: upgrade host

# Once a release is published, asks splint.bot, the host this project runs, to upgrade to it, so that
# host runs what the docs tell everyone to install. This workflow doesn't decide what gets installed.
# It sends the release's name over SSH, with a key the host holds to one command, splint-upgrade.
# That command takes only what the release workflow signed for the tag, takes a backup first, and
# refuses a release older than the one running. docs/run-a-host.md says how a host gives out such a key.
#
# It runs once the release workflow has finished for a tag, from this file as it is on main and never
# from the tag's own commit. A candidate, such as v0.4.0-rc.1, isn't sent. It also runs by hand, from
# the Actions tab or with `gh workflow run upgrade-host.yml -f release=v0.3.1`.
#
# The key, the host's address and its SSH host key belong to the `splint.bot` environment, which is
# set to be used from main alone, so no other branch, tag or pull request reaches them. Nothing here
# checks out or runs code from the repository.
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      release:
        description: The release to upgrade to, such as v0.3.1
        required: true
        type: string

permissions: {}

# One upgrade at a time, and one that has started is never cancelled.
concurrency:
  group: upgrade-host
  cancel-in-progress: false

jobs:
  upgrade:
    if: >-
      github.repository == 'nennovate/splint' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.conclusion == 'success' &&
          !contains(github.event.workflow_run.head_branch, '-')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: splint.bot
      url: https://splint.bot
    steps:
      - name: Ask the host to upgrade
        env:
          # For a tag's run, the release workflow's branch is the tag's name.
          RELEASE: ${{ inputs.release || github.event.workflow_run.head_branch }}
          HOST: ${{ vars.UPGRADE_SSH }}
          KNOWN_HOSTS: ${{ vars.UPGRADE_SSH_KNOWN_HOSTS }}
          KEY: ${{ secrets.UPGRADE_SSH_KEY }}
        run: |
          # The host reads what it's sent as a release's name and nothing else. Checking here too keeps
          # anything else from being sent at all.
          if ! printf '%s' "$RELEASE" | grep -Eqx 'v[0-9]{1,5}\.[0-9]{1,5}\.[0-9]{1,5}(-rc\.[0-9]{1,3})?'; then
            echo "::error::What this was given isn't a release's name, such as v0.3.1."
            exit 1
          fi
          if [ -z "$HOST" ] || [ -z "$KNOWN_HOSTS" ] || [ -z "$KEY" ]; then
            echo "::error::The splint.bot environment needs UPGRADE_SSH, UPGRADE_SSH_KNOWN_HOSTS and the UPGRADE_SSH_KEY secret."
            exit 1
          fi
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" >~/.ssh/upgrade
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
          # The host does the work in a unit of its own, so it finishes even if this connection drops.
          # Running this again for a release the host already runs changes nothing.
          ssh -i ~/.ssh/upgrade -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "$HOST" "$RELEASE"
