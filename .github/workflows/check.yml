name: check

# Not on an edit or a label: a run for one skips every job, and as GitHub shows the newest result under
# each name, those skips would stand in for the real results. A PR moved to a new base gets a push
# bringing in that base, which runs this.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A new push to a PR cancels the run still going for its last one, as that result no longer counts.
concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Decides once, from what the PR changes, which of the jobs below it needs. A draft needs only the
  # quick checks: its suites and Windows run once it's marked ready, which starts a new run.
  plan:
    # Where the Linux jobs run, written once here and used by name below: the runner the repository
    # variable LINUX_TEST_RUNNER names, so they can move to other runners and back with no change here.
    # Unset, they run on GitHub's own, and so does a PR from a fork, so it can't use another runner's
    # shared cache or its minutes. Releases always build on GitHub's own runners, in release.yml.
    runs-on: &linux ${{ github.event.pull_request.head.repo.full_name == github.repository && vars.LINUX_TEST_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.needed.outputs.e2e }}
      windows: ${{ steps.needed.outputs.windows }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # The suites run for code that a running system depends on. The two docs are the ones the sims
      # follow or ship, so a change to either runs them. Windows runs for the crates it builds, the
      # schemas built into them and how git writes their files out. A change to this workflow runs
      # everything, so a change to CI is always tested by the CI it makes. A moved file counts where it
      # was and where it went.
      - id: needed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          changed=$(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA")
          e2e=false windows=false
          if [ "$DRAFT" = true ]; then
            echo "A draft, so only the quick checks run. The rest run once it's marked ready." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            grep -qE '^(packages|sim|adapters|deploy|make|spec|tools/ci)/|^docs/(agents|getting-started)\.md$|^Makefile$|^\.github/workflows/check\.yml$' <<<"$changed" && e2e=true
            grep -qE '^(packages|spec)/|^\.gitattributes$|^\.github/workflows/check\.yml$' <<<"$changed" && windows=true
          fi
          echo "Suites: $e2e. Windows: $windows."
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "windows=$windows" >> "$GITHUB_OUTPUT"
      - id: shards
        if: steps.needed.outputs.e2e == 'true'
        run: echo "shards=$(python3 tools/ci/shards.py matrix)" >> "$GITHUB_OUTPUT"

  # The quick checks, on every PR: repo rules, format, lint, unit tests, dependencies and the verifier.
  check:
    runs-on: *linux
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rust-src-dir: packages
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-deny
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/verifier/go.mod
          cache: false
      - run: make rules rust deps verifier

  # What a person runs on Windows: splint, Signet and owner-key, linted and tested there. The host
  # runs on Linux, so it isn't built here. On GitHub's own runner, which builds in a few minutes once
  # warm. Windows on Arm has a free runner only for a public repository, so it's added when this is one.
  windows:
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      # The crypto library's assembly comes prebuilt in its crate, so no assembler is needed.
      AWS_LC_SYS_PREBUILT_NASM: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rust-src-dir: packages
      # Clippy has a folder of its own: on Windows, a test build after it in the same folder once
      # failed with "crate rustls required to be available in rlib format", from what clippy left.
      - working-directory: packages
        run: |
          CARGO_TARGET_DIR=target/clippy cargo clippy --all-targets --quiet -p splint-core -p signet -p splint -p owner-key -- -D warnings
          cargo test --quiet --no-fail-fast -p splint-core -p signet -p splint -p owner-key

  # Compiles once what every shard needs and saves it to the cache, so the shards don't each pay for
  # the dependencies. Cargo still rebuilds this repository's own crates after a fresh checkout.
  e2e-build:
    needs: plan
    if: needs.plan.outputs.e2e == 'true'
    runs-on: *linux
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rust-src-dir: packages
          cache-shared-key: e2e
      - run: python3 tools/ci/shards.py build

  # The suites, split by tools/ci/shards.py across runners that each run their part one sim at a time.
  # A sim that fails runs once more there, and one that then passes shows as a warning on the run.
  e2e-shard:
    name: e2e shard ${{ matrix.shard }}
    needs: [plan, e2e-build]
    if: needs.plan.outputs.e2e == 'true'
    runs-on: *linux
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      # The whole history, as sim/host_id.py builds a host from an older commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # The suites build the workspace several times over, which passed what one of GitHub's own
      # runners starts with free and ended a run with no result. These are toolchains its image ships
      # that nothing here uses. Other runners, named by LINUX_TEST_RUNNER, start with room enough.
      - if: vars.LINUX_TEST_RUNNER == ''
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      # Only e2e-build saves, so the shards don't race to write the same cache.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rust-src-dir: packages
          cache-shared-key: e2e
          cache-save-if: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # A user manager that outlasts logging out, as on a server someone set up to keep their agent
      # running, so sim/install.py takes the systemd path and sees a killed Signet come back.
      - run: |
          sudo loginctl enable-linger "$USER"
          runtime="/run/user/$(id -u)"
          for _ in $(seq 100); do [ -S "$runtime/systemd/private" ] && break; sleep 0.1; done
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="$runtime" systemctl --user show-environment > /dev/null
      - run: python3 tools/ci/shards.py run ${{ matrix.shard }}
      # Said whatever happened: how full the disk got, and what the machine is, as how many cores it
      # has and how much its network can buffer change what a timing or byte-count check sees.
      - if: always()
        run: |
          df -h / && du -sh packages/target 2>/dev/null || true
          echo "cores: $(nproc)"
          sysctl net.ipv4.tcp_rmem net.ipv4.tcp_wmem net.core.rmem_max net.core.wmem_max || true

  # The one check a PR needs: every job the plan asked for passed. A job the plan didn't ask for counts
  # as passed, but one it asked for and that was skipped, cancelled or failed doesn't, nor does a plan
  # that failed, since a skipped check passes. A draft passes on its quick checks: marking it ready
  # starts the run with the rest, and this check then waits on that run.
  checks:
    name: All checks
    needs: [plan, check, windows, e2e-build, e2e-shard]
    if: always()
    runs-on: *linux
    timeout-minutes: 5
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          E2E: ${{ needs.plan.outputs.e2e }}
          WINDOWS: ${{ needs.plan.outputs.windows }}
          CHECK: ${{ needs.check.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          BUILD: ${{ needs.e2e-build.result }}
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          {
            echo "| Job | Needed | Result |"
            echo "|---|---|---|"
            echo "| Plan | yes | $PLAN |"
            echo "| Rules, lint, unit tests | yes | $CHECK |"
            echo "| Windows | $WINDOWS | $WINDOWS_RESULT |"
            echo "| Suites: build | $E2E | $BUILD |"
            echo "| Suites: shards | $E2E | $SHARDS |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$PLAN" = success ] && [ "$CHECK" = success ] || exit 1
          [ "$WINDOWS" != true ] || [ "$WINDOWS_RESULT" = success ] || exit 1
          [ "$E2E" != true ] || { [ "$BUILD" = success ] && [ "$SHARDS" = success ]; } || exit 1
