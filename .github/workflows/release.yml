name: release

# A tag such as v0.1.0 builds every platform, rebuilds each one on a fresh runner from a different
# folder and checks every program is byte for byte the same, signs what it publishes with a keyless
# Sigstore signature tied to this workflow, tag and commit, checks the install script takes exactly
# that, and only then makes the release. An annotated tag's message, as
# `git tag -a v0.3.0 --cleanup=verbatim -F notes.md` writes it, opens the release's notes.
#
# A PR that changes this workflow or deploy/release/ builds, rebuilds and installs the same way, once
# it's ready, and publishes nothing. So does a run by hand on any branch, from the Actions tab or with
# `gh workflow run release.yml --ref BRANCH`.
on:
  push:
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: [".github/workflows/release.yml", "deploy/release/**"]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels the run still going for its last one. A tag's run is never cancelled.
concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || format('v0.0.0-try{0}', github.run_number) }}
  # What a Linux build's bytes depend on, besides packages/rust-toolchain.toml and Cargo.lock.
  ZIG: 0.14.1
  ZIGBUILD: 0.23.4

jobs:
  # A draft builds nothing: it runs once marked ready, and everything below waits on this.
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-arm64, target: aarch64-apple-darwin, runner: macos-latest }
          - { platform: macos-x86_64, target: x86_64-apple-darwin, runner: macos-latest }
          # Static, so they run on any Linux, and cross-built so a private repository needs no Arm runner.
          - { platform: linux-x86_64, target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { platform: linux-arm64, target: aarch64-unknown-linux-musl, runner: ubuntu-latest }
          # Windows on Arm is cross-built too, by Microsoft's own compiler on an x86_64 runner.
          - { platform: windows-x86_64, target: x86_64-pc-windows-msvc, runner: windows-latest }
          - { platform: windows-arm64, target: aarch64-pc-windows-msvc, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # Git Bash on Windows, so every platform builds and packs with the same scripts.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rust-src-dir: packages
          target: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG }}
      - if: runner.os == 'Linux'
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-zigbuild@${{ env.ZIGBUILD }}
      # A Mac build's bytes also depend on Xcode's linker, so the log says which one.
      - if: runner.os == 'macOS'
        run: xcodebuild -version && ld -v
      - name: Build
        run: deploy/release/build.sh "${{ matrix.target }}" "$VERSION"
      - name: Package
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: deploy/release/package.sh "packages/target/$TARGET/release" "$PLATFORM" "$VERSION" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: splint-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Builds each platform again, on another runner, from another folder, with nothing cached, and checks
  # every program is the same as the build's, byte for byte. Anyone can do the same from a release's
  # commit with deploy/release/build.sh.
  rebuild:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-arm64, target: aarch64-apple-darwin, runner: macos-latest }
          - { platform: macos-x86_64, target: x86_64-apple-darwin, runner: macos-latest }
          - { platform: linux-x86_64, target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { platform: linux-arm64, target: aarch64-unknown-linux-musl, runner: ubuntu-latest }
          - { platform: windows-x86_64, target: x86_64-pc-windows-msvc, runner: windows-latest }
          - { platform: windows-arm64, target: aarch64-pc-windows-msvc, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: somewhere-else
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rust-src-dir: somewhere-else/packages
          target: ${{ matrix.target }}
          cache: false
      - if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG }}
      - if: runner.os == 'Linux'
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-zigbuild@${{ env.ZIGBUILD }}
      - if: runner.os == 'macOS'
        run: xcodebuild -version && ld -v
      - name: Build again
        env:
          CARGO_HOME: ${{ runner.temp }}/another-cargo-home
        run: somewhere-else/deploy/release/build.sh "${{ matrix.target }}" "$VERSION"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: splint-${{ matrix.platform }}
          path: built
      - name: Every program is the same as the build's
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          tar -xzf "built/splint-$VERSION-$PLATFORM.tar.gz" -C built
          again="somewhere-else/packages/target/$TARGET/release"
          differ=0
          # Windows's programs end in .exe, and it has no host.
          case $PLATFORM in
          windows-*) exe=.exe pairs="splint:splint signet:splint-signet owner-key:splint-owner-key" ;;
          *) exe= pairs="splint:splint host:splint-host signet:splint-signet owner-key:splint-owner-key" ;;
          esac
          for pair in $pairs; do
            first=$(sha256sum "built/splint-$VERSION-$PLATFORM/bin/${pair#*:}$exe" | cut -d' ' -f1)
            second=$(sha256sum "$again/${pair%%:*}$exe" | cut -d' ' -f1)
            echo "${pair#*:}: $first, rebuilt $second"
            [ "$first" = "$second" ] || differ=1
          done
          [ "$differ" = 0 ] || { echo "The rebuild isn't the same, so this release isn't reproducible"; exit 1; }
      # Kept when they differ, so the two builds can be compared.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuilt-${{ matrix.platform }}
          path: |
            somewhere-else/packages/target/${{ matrix.target }}/release/splint*
            somewhere-else/packages/target/${{ matrix.target }}/release/host*
            somewhere-else/packages/target/${{ matrix.target }}/release/signet*
            somewhere-else/packages/target/${{ matrix.target }}/release/owner-key*
            somewhere-else/packages/target/${{ matrix.target }}/release/*.pdb
          retention-days: 7

  # On a PR or by hand: what an agent on Linux and on a Mac would get, from these builds.
  try:
    if: github.event_name != 'push'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: splint-*
          merge-multiple: true
          path: dist
      - run: deploy/release/render.sh "$VERSION" dist
      - run: deploy/release/check-install.sh "$VERSION" dist
      # The other two platforms have no runner of their own here, so each is run translated.
      - name: The Intel Mac build installs and runs, under Rosetta
        if: runner.os == 'macOS'
        run: |
          home=$(mktemp -d)
          HOME="$home" SPLINT_FROM_DIR=dist arch -x86_64 /bin/sh dist/install.sh
          file "$home/.splint/bin/splint" | grep x86_64
          [ "$(arch -x86_64 "$home/.splint/bin/splint" --version)" = "splint $VERSION" ]
      - if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: The arm64 Linux build installs and runs, under emulation
        if: runner.os == 'Linux'
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD/dist:/dist:ro" -e VERSION \
            alpine:3.22@sha256:bfe7ceb9f09ec0566c48fb93356e45a47a00be5a1dd14fa5b909e7709c66b034 \
            sh -c 'uname -m && SPLINT_FROM_DIR=/dist sh /dist/install.sh && [ "$(~/.splint/bin/splint --version)" = "splint $VERSION" ]'
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # Signed for real, but by a PR or a branch's run rather than the release workflow for that tag, so
      # it has to refuse. A fork's PR can't sign, so it skips this and the next.
      - name: A signature from anything but the release refuses
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          for archive in dist/*.tar.gz; do cosign sign-blob --yes --bundle "$archive.sigstore.json" "$archive" >/dev/null; done
          if HOME="$(mktemp -d)" SPLINT_FROM_DIR=dist sh dist/install.sh 2>said; then
            echo "install.sh took a signature that isn't the release's"; exit 1
          fi
          grep "isn't signed by" said
      # The commit pin is what ties an archive to its source, so check cosign holds it: this run's own
      # signature passes for the commit it ran on, and fails for any other.
      - name: A signature counts only for the commit it was made on
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SIGNER: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          archive=$(ls dist/*.tar.gz | head -n 1)
          check() {
            cosign verify-blob --bundle "$archive.sigstore.json" --certificate-identity "$SIGNER" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-sha "$1" "$archive"
          }
          check "$GITHUB_SHA"
          if check 0000000000000000000000000000000000000000 2>/dev/null; then
            echo "cosign took a signature for another commit"; exit 1
          fi

  # On a PR or by hand: what a person on Windows would get, from these builds, with install.ps1. Windows
  # on Arm runs x86_64 programs translated, but not the other way round, so only the x86_64 build runs.
  try-windows:
    if: github.event_name != 'push'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: splint-*
          merge-multiple: true
          path: dist
      - shell: bash
        run: deploy/release/render.sh "$VERSION" dist
      # Bugs these catch: an install.ps1 that installs nothing that runs, takes a changed archive or
      # leaves a folder behind when it refuses, misses a changed program with --verify, or runs as the
      # unreleased template.
      - name: install.ps1 installs what was released, and refuses anything else
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = (Resolve-Path dist).Path
          $scratch = Join-Path $env:RUNNER_TEMP 'splint-install-check'
          function Install-From([string]$From, [string]$UserFolder, [string[]]$Words) {
            $env:SPLINT_FROM_DIR = $From
            $env:USERPROFILE = $UserFolder
            & ([scriptblock]::Create((Get-Content -Raw "$dist\install.ps1"))) @Words
          }
          Install-From $dist "$scratch\home" @()
          $splint = "$scratch\home\.splint\bin\splint.exe"
          $said = & $splint --version
          if ($said -ne "splint $env:VERSION") { throw "the installed splint says it's $said" }
          if (-not (Test-Path "$scratch\home\.splint\examples\meeting-1.json")) { throw "the example types weren't installed" }
          Install-From $dist "$scratch\home" @('--verify')
          Add-Content -NoNewline -Path "$scratch\home\.splint\bin\splint-owner-key.exe" -Value 'x'
          $refused = $false
          try { Install-From $dist "$scratch\home" @('--verify') } catch { $refused = $true }
          if (-not $refused) { throw "install.ps1 --verify passed a program with a byte added" }
          New-Item -ItemType Directory "$scratch\changed" | Out-Null
          Copy-Item "$dist\*" "$scratch\changed"
          Get-ChildItem "$scratch\changed\*.tar.gz" | ForEach-Object { Add-Content -NoNewline -Path $_.FullName -Value 'x' }
          $refused = $false
          try { Install-From "$scratch\changed" "$scratch\fresh" @() } catch { $refused = $_.Exception.Message -match "doesn't match the checksum" }
          if (-not $refused) { throw "an archive with a byte added installed" }
          if (Test-Path "$scratch\fresh\.splint") { throw "a refused install left its folder behind" }
          $refused = $false
          try { & ([scriptblock]::Create((Get-Content -Raw deploy\release\install.ps1))) } catch { $refused = $_.Exception.Message -match 'the template in the repository' }
          if (-not $refused) { throw "the template in the repository wasn't refused as the template" }
          # Bug this catches: a cosign found, then gone when the signature is checked, left the exit
          # code of the last program that ran, so an unchecked archive passed as signed.
          function cosign { if ($args[0] -eq 'version') { 'GitVersion: v3.0.0' } else { & "$scratch\gone\cosign.exe" @args } }
          New-Item -ItemType Directory "$scratch\unsigned" | Out-Null
          Copy-Item "$dist\*" "$scratch\unsigned"
          Get-ChildItem "$scratch\unsigned\*.tar.gz" | ForEach-Object { Set-Content -Path "$($_.FullName).sigstore.json" -Value '{}' }
          cmd /c exit 0
          $refused = $false
          try { Install-From "$scratch\unsigned" "$scratch\unchecked" @() } catch { $refused = $_.Exception.Message -match "isn't signed" }
          Remove-Item Function:\cosign
          if (-not $refused) { throw "an archive whose signature cosign never checked installed" }
          "install.ps1 checks out for $env:VERSION"
          # The refused installs above leave a failing exit code behind, which would fail this step.
          exit 0
      # Bugs these catch: `irm | iex`, the line people are given, leaving install.ps1's settings and
      # functions in the person's own PowerShell, and Windows PowerShell 5.1, which most people have,
      # taking what a program says on stderr for a failure, as cosign says there that a signature
      # checked out. The stand-in cosign says what cosign says, where cosign says it, and passes.
      - name: install.ps1 run as people run it, in Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $dist = (Resolve-Path dist).Path
          $scratch = Join-Path $env:RUNNER_TEMP 'splint-install-iex'
          $tools = New-Item -ItemType Directory -Force "$scratch\tools"
          $from = New-Item -ItemType Directory -Force "$scratch\from"
          Set-Content -Path "$tools\cosign.cmd" -Value "@echo off`r`nif ""%1""==""version"" (echo GitVersion: v3.0.0& echo cosign's version, on stderr 1>&2& exit /b 0)`r`necho Verified OK 1>&2`r`nexit /b 0"
          Copy-Item "$dist\*" $from
          Get-ChildItem "$from\*.tar.gz" | ForEach-Object { Set-Content -Path "$($_.FullName).sigstore.json" -Value '{}' }
          $env:PATH = "$tools;$env:PATH"
          $env:SPLINT_FROM_DIR = $from
          $env:USERPROFILE = "$scratch\home"
          Get-Content -Raw "$dist\install.ps1" | Invoke-Expression
          $said = & "$scratch\home\.splint\bin\splint.exe" --version
          if ($said -ne "splint $env:VERSION") { throw "the installed splint says it's $said" }
          if ($ErrorActionPreference -ne 'Continue') { throw "install.ps1 left this PowerShell's errors at $ErrorActionPreference" }
          if (Get-Command Install-Splint -ErrorAction SilentlyContinue) { throw "install.ps1 left its functions in this PowerShell" }
          "install.ps1 runs with irm | iex in Windows PowerShell $($PSVersionTable.PSVersion)"

  publish:
    if: github.event_name == 'push'
    needs: [build, rebuild]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: splint-*
          merge-multiple: true
          path: dist
      - run: deploy/release/render.sh "$VERSION" dist
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign
        run: |
          for file in dist/*.tar.gz dist/install.sh dist/install.ps1 dist/agents.md dist/SHA256SUMS; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file" >/dev/null
          done
      # GitHub's own attestations are free only for public repositories, and add `gh attestation verify`.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/install.sh
            dist/install.ps1
            dist/agents.md
            dist/SHA256SUMS
      - name: The install script takes what was signed, with cosign here to check it
        run: deploy/release/check-install.sh "$VERSION" dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # What's new, from the tag's own message where it's annotated. Checkout fetches a tag's commit
          # alone, so the tag itself is fetched first. A tag with no message of its own adds nothing.
          git fetch --quiet --force --depth=1 origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
          : >notes.md
          if [ "$(git cat-file -t "$VERSION")" = tag ]; then
            git cat-file tag "$VERSION" | sed '1,/^$/d' | sed '/^-----BEGIN [A-Z ]*SIGNATURE-----$/,$d' >notes.md
            printf '\n' >>notes.md
          fi
          cat >>notes.md <<EOF
          Install, as the agent or its owner, with no sudo and nothing to build:

              curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/install.sh | sh

          Or on Windows, in PowerShell, which installs splint, Signet and owner-key without the host:

              irm https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/install.ps1 | iex

          Built from ${GITHUB_SHA}. install.sh has the SHA-256 of every archive and every program fixed
          inside it, and refuses anything else. To check install.sh itself first, with cosign 3 or later:

              cosign verify-blob --bundle install.sh.sigstore.json install.sh \\
                --certificate-identity https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${VERSION} \\
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
                --certificate-github-workflow-sha ${GITHUB_SHA}

          Later, \`splint verify\` checks the installed programs are still this release's, and so does
          this install.sh with --verify, which runs none of them. deploy/release/build.sh at ${GITHUB_SHA}
          rebuilds every program byte for byte, as this workflow did before publishing.

          agents.md is the official copy of the instructions for agents, the same as docs/agents.md at
          ${GITHUB_SHA}, and listed in SHA256SUMS. A host's own page only points to it, and whatever a
          host's page says, install only from github.com/${GITHUB_REPOSITORY}.

          Or, with GitHub's own attestation: gh attestation verify install.sh --repo ${GITHUB_REPOSITORY}
          EOF
          # A candidate, such as v0.2.0-rc.1, is a pre-release, so it never becomes the release that
          # `releases/latest` gives, which is where the docs send people and agents to install.
          candidate=
          case "$VERSION" in *-*) candidate=--prerelease ;; esac
          gh release create "$VERSION" dist/* --verify-tag $candidate --title "Splint $VERSION" --notes-file notes.md
