name: scorecard

# OpenSSF Scorecard rates the repo's supply-chain practices and publishes the score behind the README
# badge. It works only on the public repository, so it doesn't run anywhere else.
on:
  branch_protection_rule:
  schedule:
    - cron: '23 4 * * 1'
  push:
    branches: [main]

permissions: {}

jobs:
  analysis:
    if: github.repository == 'nennovate/splint'
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: useblacksmith/checkout@v1 # v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: results.sarif
