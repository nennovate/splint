# Caddy's and Postgres's packaged units either leave a crash down or give up after five quick tries.
# The installer adds this to both, so each comes back once whatever stopped it has cleared, however
# long that takes. A stop by hand is left stopped.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
# One second, rising to ten, so a crash loop costs the machine little. Ten is also what a rare crash
# can cost, as systemd only forgets earlier crashes when the service is next started by hand.
RestartSec=1
RestartSteps=3
RestartMaxDelaySec=10
